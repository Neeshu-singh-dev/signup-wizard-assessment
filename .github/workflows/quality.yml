name: Quality Check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check script.js
      - name: Validate required app files
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          grep -q 'data-step="1"' index.html
          grep -q 'data-step="2"' index.html
          grep -q 'data-step="3"' index.html
          grep -q 'data-step="4"' index.html
          grep -q 'data-step="success"' index.html
          grep -q '18 or older' script.js
          grep -q '123456' script.js
